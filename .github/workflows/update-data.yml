name: Update data

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update:san_diego
      - name: Commit changes
        run: |
          if git diff --quiet -- public/api; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/api
            git commit -m "Update San Diego data"
            git push
          fi
